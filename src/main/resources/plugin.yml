name: NovaSecurity
version: 1.0.0
main: de.nova.security.NovaSecurity
api-version: 1.20
author: Nova Runtime
description: Advanced exploit and flood protection for Paper/Spigot servers

commands:
  novasecurity:
    description: Main command for NovaSecurity
    permission: novasecurity.admin

permissions:
  novasecurity.admin:
    default: op
  novasecurity.alerts:
    default: op
  novasecurity.bypass:
    default: op
