security:
  chunk-entities:
    enabled: true
    enabled-worlds:
      - world
      - world_nether
    disabled-worlds:
      - creative
      - plots

  persistence:
    enabled: true

  book:
    max-pages: 50
    max-chars-per-page: 256
    action: KICK

  command:
    max-per-second: 10
    window-ms: 1000
    action: WARN

  chunk-entities:
    max: 150
    action: WARN

  tabcomplete:
    max-per-second: 15
    window-ms: 1000
    action: CANCEL

  chunk:
    max-loads: 20
    window-ms: 1000
    action: WARN

  interact:
    max-per-second: 20
    window-ms: 1000
    action: CANCEL

  inventory:
    max-clicks: 30
    window-ms: 1000
    action: WARN

  chat:
    max-length: 256
    action: WARN

  chunk-tileentities:
    max: 80
    action: WARN

  nbt:
    max-name-length: 64
    max-lore-lines: 20
    max-lore-length: 128
    action: WARN

  cooldown:
    enabled: true
    time-ms: 5000

  escalation:
    enabled: true
    levels:
      - violations: 3
        action: WARN
      - violations: 6
        action: KICK

messages:
  kick: "§cInvalid client data detected."

logging:
  debug: false
